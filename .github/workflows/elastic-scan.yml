name: Elastic Scanner

on:
  workflow_dispatch:
  schedule:
    # Every hour during US market hours (9:00 AM - 5:00 PM ET)
    # ET = UTC-4 (summer) / UTC-5 (winter)
    # 13:00 UTC = 9 AM ET, 21:00 UTC = 5 PM ET
    - cron: "0 13-21 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Elastic Scanner
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python -m src.main

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_id }}
          path: output/latest.csv
          retention-days: 7
